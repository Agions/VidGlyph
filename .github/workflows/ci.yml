name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧流水线在推新提交后自动取消，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Type check + lint + test (parallel with build + rust-test) ───────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 统一的本地/CI 质量门禁入口：type-check → lint → test
      - name: Quality gate
        run: pnpm check

      - name: Coverage report
        run: pnpm test:coverage

      - name: Dependency audit
        run: pnpm depcheck

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Build docs
        run: pnpm docs:build

  # ── Tauri build (parallel with quality + rust-test, no blocking dependency) ───
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libffmpegthumbnailer-dev \
            libjpeg-dev \
            libvips-dev \
            ffmpeg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tauri
        run: pnpm tauri build

  # ── Rust unit tests (parallel with quality + build) ───────────────────────────
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libffmpegthumbnailer-dev \
            libjpeg-dev \
            libvips-dev \
            ffmpeg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run unit tests
        run: |
          cd src-tauri
          cargo test

      # 格式化与静态检查：与本地 `pnpm lint:rust` 等价
      - name: Check formatting
        run: |
          cd src-tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets -- -D warnings
