name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v0.0.1)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend (web build – shared by all platforms) ───────────────────────────
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web
        run: pnpm build
        env:
          CI: true

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist

  # ── Tauri desktop app (one job per target) ───────────────────────────────────
  build-tauri:
    needs: build-web
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            label: ubuntu-x64
          - platform: windows-latest
            args: ''
            label: windows-x64
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-apple-silicon

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libffmpegthumbnailer-dev \
            libjpeg-dev \
            libvips-dev \
            libglib2.0-dev \
            ffmpeg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'SubLens ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## SubLens ${{ github.event.inputs.tag || github.ref_name }}

            专业视频硬字幕提取与蒸馏工具，支持离线与云端双模式字幕提取。基于 Tauri 2.x + Vue 3 + Rust 构建。

            ### Downloads

            | Platform | Architecture | File |
            |---------|-------------|------|
            | macOS | Apple Silicon (M1/M2/M3) | `SubLens_macos-apple-silicon.tar.gz` |
            | Linux | x86_64 | `SubLens_ubuntu-x64.tar.gz` |
            | Windows | x64 | `SubLens_windows-x64.zip` |

            ### Features
            - ⚡ 双模式 OCR 引擎：支持本地离线（Tesseract / Native ONNX）与云端 API（Gemini / Vision）
            - 🎯 8 点手柄交互选区：画布拖拽与 0~1 归一化选区
            - 🪄 自动选区识别：自动探测视频底部字幕轮廓
            - 🤖 AI 智能字幕润色：一键美化字幕文本并修正同音错别字
            - 📦 多格式导出：支持一键导出为 SRT, VTT, TXT, JSON 等字幕格式
            - 🔒 凭据加密：本地 AES 加密保存 API Key，支持随时安全抹除

            ### Installation
            1. Download the archive for your platform
            2. Extract and run `SubLens` (Linux/macOS) or `SubLens.exe` (Windows)
            3. **macOS**: run `xattr -cr ./SubLens` if blocked by Gatekeeper
          args: ${{ matrix.args }}
