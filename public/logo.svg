<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VidGlyph Logo">
  <title>VidGlyph</title>
  <desc>VidGlyph · 字映 - 专业视频字幕光学解析工坊 Logo</desc>

  <defs>
    <!-- 暗黑 Slate 主渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Emerald 翡翠高亮渐变 -->
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 蒸馏光芒与阴影 -->
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="logoClip">
      <rect x="24" y="24" width="464" height="464" rx="96"/>
    </clipPath>
  </defs>

  <!-- 背景：圆角矩形 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>

  <!-- 高光边框 -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#emeraldGradient)" stroke-width="3" opacity="0.3"/>

  <!-- 主蒸馏标志 (Subtitle Lens & Frame Focus) -->
  <g transform="translate(256, 200)" filter="url(#emeraldGlow)">
    <!-- 外层 8 点 ROI 框选句柄框 -->
    <rect x="-110" y="-90" width="220" height="150" rx="16" fill="none" stroke="url(#emeraldGradient)" stroke-width="6" stroke-dasharray="8 4"/>

    <!-- 4角 ROI 手柄 -->
    <circle cx="-110" cy="-90" r="8" fill="#34d399"/>
    <circle cx="110" cy="-90" r="8" fill="#34d399"/>
    <circle cx="-110" cy="60" r="8" fill="#34d399"/>
    <circle cx="110" cy="60" r="8" fill="#34d399"/>

    <!-- 蒸馏核心 'D' 图腾 / 字幕文本提取脉冲 -->
    <path d="M-50,-50 H10 C30,-50 45,-35 45,-10 C45,15 30,30 10,30 H-50 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- 文本音轨/字幕线条 -->
    <rect x="-32" y="-20" width="48" height="8" rx="4" fill="url(#emeraldGradient)"/>
    <rect x="-32" y="0" width="32" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- 底部 VidGlyph 品牌标志 -->
  <g transform="translate(256, 400)">
    <text x="0" y="0" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="52" font-weight="800" letter-spacing="-1.5"
          fill="#ffffff">
      VidGlyph
    </text>
    <text x="0" y="32" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="14" font-weight="600" letter-spacing="4"
          fill="#10b981" opacity="0.9">
      SUBTITLE EXTRACTION STUDIO
    </text>
  </g>
</svg>
