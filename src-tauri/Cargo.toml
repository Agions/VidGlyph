[package]
name = "vidglyph"
version = "0.1.0"
description = "VidGlyph · 字映 - 专业视频硬编码字幕光学提取与精编工坊"
authors = ["Agions"]
license = "MIT"
repository = "https://github.com/Agions/VidGlyph"
edition = "2021"

[lib]
name = "vidglyph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }

# Rust-native image processing (replaces OpenCV in auto_detect_roi.py)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
# Low-level image bindings for Canny edge detection
rgb = "0.8"
# Pin time to avoid conflict with tauri-utils 2.9.2 (missing HourBase trait in 0.3.47+)
time = ">=0.3.36, <0.3.47"

# ─── Rust-native OCR engine (replaces PaddleOCR Python script) ────────────────
# ONNX Runtime binding for PaddleOCR PP-OCRv6 model inference
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
# N-dimensional array for ONNX tensor construction
ndarray = "0.17"
# float16 support for ONNX tensor element type
half = "2.4"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = true
